name: Build Awfaq Encyclopedia HTML

on:
  push:
    branches:
      - awfaq-talismans-encyclopedia
    paths:
      - 'projects/awfaq-talismans/volumes/**'
      - 'projects/awfaq-talismans/build_html.py'
      - '.github/workflows/package-awfaq-encyclopedia.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout encyclopedia source
        uses: actions/checkout@v4
        with:
          ref: awfaq-talismans-encyclopedia

      - name: Generate HTML edition and verified ZIP
        run: python3 projects/awfaq-talismans/build_html.py

      - name: Upload HTML website as ZIP
        uses: actions/upload-artifact@v4
        with:
          name: awfaq-encyclopedia-html
          path: projects/awfaq-talismans/dist/موسوعة-الأوفاق-والطلاسم-HTML.zip
          if-no-files-found: error
          retention-days: 30
